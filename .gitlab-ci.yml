# Equivalent GitLab CI de .github/workflows/{ruff,build-image}.yml.
# Le build d'image utilise kaniko : pas de Docker-in-Docker/privileged requis,
# fonctionne tel quel sur les runners partages GitLab.com.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'

stages:
  - lint
  - verify
  - build

ruff:
  stage: lint
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - uv sync --locked
    - uv run ruff format --check .
    - uv run ruff check .

verify-tag-on-main:
  stage: verify
  image:
    name: alpine/git:latest
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  variables:
    GIT_DEPTH: 0
  script:
    - git fetch origin main --quiet
    - |
      if ! git merge-base --is-ancestor "$CI_COMMIT_SHA" origin/main; then
        echo "Le tag $CI_COMMIT_TAG ne descend pas de main. Build annule."
        exit 1
      fi

build-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  needs:
    - verify-tag-on-main
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - IMAGE=$(echo "$CI_REGISTRY_IMAGE" | tr '[:upper:]' '[:lower:]')
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/Dockerfile" --destination "${IMAGE}:${CI_COMMIT_TAG}" --destination "${IMAGE}:latest"
